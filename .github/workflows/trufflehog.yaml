name: TruffleHog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # One run per workflow per ref; pull request runs are cancelled by a newer
  # push, runs on main are not.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@v3.99.3   # a release, not a moving branch
        with:
          extra_args: --only-verified
